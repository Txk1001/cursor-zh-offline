name: 漏译或错译
description: 报告集成版界面或公共精校词典的问题
body:
  - type: input
    id: versions
    attributes:
      label: Cursor、维护包和系统版本
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: 英文原文、所在页面和建议译法
      description: 请先删除聊天内容中的个人信息、密钥和路径等敏感内容。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 复现步骤与脱敏截图
