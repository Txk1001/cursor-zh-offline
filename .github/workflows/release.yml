name: Preview release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Check release version
        shell: pwsh
        run: |
          $version = (Get-Content config.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag/version mismatch' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: '.python-version'
      - run: npm ci
      - name: Test deterministic technical protection (8 rules)
        run: npm run test:protection
      - run: npm test
      - run: npm run check:repo
      - run: npm run lint:md
      - run: npm run sync -- --strategy=api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run verify
      - run: npm run package -- --skip-build
      - run: node scripts/setup-offline.mjs --download --state="${{ runner.temp }}/cursor-zh-release"
      - run: npm run test:offline -- --state="${{ runner.temp }}/cursor-zh-release"
      - name: Assemble release and checksums
        shell: pwsh
        run: |
          $version = (Get-Content config.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Path release -Force | Out-Null
          ./scripts/build-public-archive.ps1 -SourceOnly -OutputPath "release/cursor-zh-offline-$version-source.zip"
          ./scripts/build-public-archive.ps1 -WithOffline -OutputPath "release/cursor-zh-offline-$version-Windows-x64-offline.zip"
          Copy-Item -LiteralPath "dist/cursor-language-pack-$version.vsix" -Destination release
          $lines = Get-ChildItem release -File | Where-Object { $_.Extension -in @('.zip','.vsix') } | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          }
          $lines | Set-Content -LiteralPath release/SHA256SUMS -Encoding utf8
      - name: Bind candidate to source and evidence
        run: node scripts/write-release-candidate.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cursor-zh-release-candidate
          if-no-files-found: error
          path: |
            release/*.vsix
            release/*.zip
            release/*.sha256
            release/SHA256SUMS
            release/RELEASE-CANDIDATE.json
