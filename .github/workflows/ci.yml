name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    # Keep existing required check names; pin Linux while CPython 3.12.10 has no Ubuntu 26 build.
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'ubuntu-24.04' || 'windows-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: '.python-version'
      - run: npm ci
      - name: Test deterministic technical protection (8 rules)
        run: npm run test:protection
      - run: npm test
      - run: npm run check:repo
      - name: 检查 Markdown 文档
        run: npm run lint:md
      - run: npm run sync -- --strategy=api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run verify
      - run: npm run package -- --skip-build
      - name: Build and validate source archive
        shell: pwsh
        run: ./scripts/build-public-archive.ps1 -SourceOnly -OutputPath "${{ runner.temp }}/cursor-zh-source.zip"
      - name: Prepare isolated offline runtime
        if: runner.os == 'Windows'
        run: node scripts/setup-offline.mjs --download --state="${{ runner.temp }}/cursor-zh-test"
      - name: Test actual offline runtime
        if: runner.os == 'Windows'
        run: npm run test:offline -- --state="${{ runner.temp }}/cursor-zh-test"
      - name: Build and validate full archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-public-archive.ps1 -WithOffline -OutputPath "${{ runner.temp }}/cursor-zh-offline.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cursor-zh-${{ runner.os }}
          path: |
            dist/*.vsix
            ${{ runner.temp }}/cursor-zh-*.zip
            ${{ runner.temp }}/cursor-zh-*.zip.sha256
